name: Android

on:
  push:
    branches: [main]
    paths-ignore: ["web/**", ".github/workflows/web.yml", "README.md"]
  pull_request:
    paths-ignore: ["web/**", "README.md"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Testes e APK
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Publicar o APK na release "afinador"
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk afinador.apk
          gh release view afinador >/dev/null 2>&1 || \
            gh release create afinador --title "Afinador" \
              --notes "Baixe o afinador.apk abaixo e abra no celular. Instruções no README."
          gh release upload afinador afinador.apk --clobber
